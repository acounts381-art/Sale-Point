<style>

.cr{display:flex;margin-top:14px}.cl{flex:1;padding-right:10px;min-width:0}.cc{flex:1;padding-left:10px;border-left:1px solid var(--line);min-width:0}.cap{font-weight:bold;margin-bottom:6px;display:flex;align-items:center;gap:8px}.plus{width:26px;height:26px;border-radius:50%;border:0;background:var(--btn);color:#fff;font-size:18px;line-height:1;cursor:pointer;padding:0}.crr{display:flex;gap:4px;margin-bottom:8px}.crr select{flex:1.4;min-width:0;width:auto}.crr input{flex:none;min-width:0;width:100px}.crr select,.crr input{height:32px;padding:0 4px;font-size:13px;line-height:normal;box-sizing:border-box}.cc label{display:block;font-size:13px;color:var(--mut);margin:0 0 3px}.cc input{margin-bottom:8px}.cl .btn{width:100%;margin-top:4px;padding:8px}
.lf{display:flex;gap:6px;margin-bottom:12px}.lf label{display:flex;flex-direction:column;flex:1;min-width:0;font-size:11px;color:var(--mut)}.lf label:nth-child(-n+2){flex:0 0 auto}.lf input[type=date]{width:auto;min-width:0}.lf input,.lf select{margin-top:2px;padding:6px 4px;font-size:12px;width:100%}
.lg{width:100%;border-collapse:collapse;font-size:13px}.lg th{font-weight:normal;color:var(--mut);padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)}.lg td{padding:8px 4px;border-bottom:1px solid var(--line);white-space:nowrap}.lg th.n,.lg td.n{text-align:right}.lg tr.tot td{border-radius:0;border-left:0;border-right:0;padding:8px 4px}

.selh{cursor:pointer;text-decoration:underline dotted}.selh.on{color:var(--btn);font-weight:bold}.sr input.csel{background:rgba(47,111,228,.18);border-color:var(--btn)}.tb{display:flex;gap:6px;align-items:center}

.sub{display:none!important}
.tabs{display:flex;margin-bottom:12px;border-bottom:2px solid var(--line)}.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:12px;font-size:17px;color:var(--mut);cursor:pointer}.tabs button.on{color:var(--btn);border-bottom-color:var(--btn);font-weight:bold}.g th{font-size:14px}.g td,.g th{padding:2px 2px}
tr.tot td{background:var(--tot);font-weight:bold;padding:10px 6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
.row2{display:flex;gap:10px;margin-bottom:10px}.row2>div{flex:1}

.btn{flex:1;background:var(--btn);color:#fff;border:0;border-radius:10px;padding:10px;font-size:15px;cursor:pointer}
.lt{background:var(--card);border:1px solid var(--line);border-radius:4px;margin-top:12px;overflow-x:auto}
.lt table{border-spacing:0;font-size:14px}
.lt th{color:var(--mut);font-weight:bold;padding:12px 8px;border-bottom:1px solid var(--line)}
.lt td{padding:14px 8px;border-bottom:1px solid var(--line)}
.lt tr:last-child td{border-bottom:0}
.ab{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:14px;cursor:pointer;margin-right:2px}

#rl{overflow-x:auto;margin-top:8px}.rt{border-spacing:0 6px;font-size:14px}.rt th{font-size:12px;text-align:center;font-weight:normal;color:var(--mut);padding:4px 2px}.rt th:nth-child(2){text-align:left}.rt td{padding:2px}.gr{background:var(--tot);font-weight:bold;padding:8px 10px!important;border-radius:4px}.rb{width:44px;padding:5px 2px;text-align:center;border-radius:10px;font-size:14px}
#drawer{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:320px;background:var(--card);transform:translateX(-100%);transition:transform .2s;z-index:9;padding:20px 0;padding-top:calc(20px + env(safe-area-inset-top,0px))}

.mi{display:block;width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;padding:15px 20px;font-size:18px;color:var(--ink);cursor:pointer}
.sub{padding-left:18px;display:none}.sub.show{display:block}.sub .mi{font-size:16px}
#shade{position:fixed;inset:0;background:var(--shade);display:none;z-index:8}
body.open #shade{display:block}
#modal{position:fixed;inset:0;background:var(--shade);display:none;z-index:20;overflow-y:auto;padding:16px}
#modal.show{display:block}
.mc{background:var(--card);max-width:420px;margin:0 auto;border-radius:12px;padding:16px}
.mc h3{margin:0;font-size:20px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mc label{display:block;font-size:13px;color:var(--mut);margin:0 0 4px}
.pic{width:90px;height:90px;border:1px dashed var(--mut);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px;cursor:pointer;margin-bottom:14px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.fld{margin-bottom:12px}
</style>

<body>
<div id="app">
 <header><button class="ic" id="menu" aria-label="Menu">☰</button><button class="ic" id="back" aria-label="Back" style="display:none">←</button><h1 id="title">Sale Point</h1></header>

<script>
var products=[
 {id:"P001",n:"Dunhill Light 20HL",cat:"FMC",r:520,ws:500,po:10,sp:20,pic:""},
 {id:"P002",n:"Dunhill Spl 20HL",cat:"FMC",r:480,ws:460,po:10,sp:20,pic:""},
 {id:"P003",n:"B & H - New 20HL",cat:"FMC",r:450,ws:430,po:10,sp:20,pic:""}];
var sales=[];
var cats=["FMC","VELO"];
var to0=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10),from=to0,to=to0,page="home",delIdx=-1,upMsg="";
var v=document.getElementById("view"),t=document.getElementById("title"),modal=document.getElementById("modal");
function fmt(n){return Number(n).toLocaleString("en-US")}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function go(p){page=p;delIdx=-1;closeMenu();render();window.scrollTo(0,0)}
function openMenu(){document.getElementById("drawer").classList.add("open");document.body.classList.add("open")}
function closeMenu(){document.getElementById("drawer").classList.remove("open");document.body.classList.remove("open")}
function folder(l,g){return '<button class="folder" data-go="'+g+'"><span>📁</span>'+l+'</button>'}
var tab="sale",invMsg="",I={no:"INV-001",date:"",cust:"",rows:[{p:"",q:""}]};
function tabs(){return '<div class="tabs"><button data-tab="sale" class="'+(tab=="sale"?"on":"")+'">Sale</button><button data-tab="invoice" class="'+(tab=="invoice"?"on":"")+'">Invoice</button><button data-tab="summary" class="'+(tab=="summary"?"on":"")+'">Summary</button></div>'}
function prod(id){return products.find(function(x){return x.id==id})}
function invCalc(){var tq=0,ta=0;I.rows.forEach(function(r,i){var p=prod(r.p),q=+r.q||0,rt=p?p.r:0,a=q*rt;tq+=q;ta+=a;document.getElementById("ir"+i).textContent=p?fmt(rt):"";document.getElementById("ia"+i).textContent=p?fmt(a):""});document.getElementById("itq").textContent=fmt(tq);document.getElementById("ita").textContent=fmt(ta)}
function invoiceOld(){
 var h=tabs()+'<div class="panel"><div class="dates"><label>Invoice # <input id="in" value="'+esc(I.no)+'" style="width:100px"></label><label>Date <input type="date" id="idt" value="'+I.date+'" style="width:130px"></label></div><div class="fld"><input id="cu" placeholder="Customer name" value="'+esc(I.cust)+'"></div><div class="scroll"><table class="g"><tr><th>Sr</th><th>Product</th><th>Qty</th><th class="n">Rate</th><th class="n">Amt</th><th></th></tr>';
 I.rows.forEach(function(r,i){var o='<option value="">Select</option>';products.forEach(function(p){o+='<option value="'+esc(p.id)+'"'+(p.id==r.p?' selected':'')+'>'+esc(p.n)+'</option>'});
  h+='<tr><td>'+(i+1)+'</td><td><select data-ip="'+i+'">'+o+'</select></td><td><input type="number" data-iq="'+i+'" value="'+esc(r.q)+'" style="width:56px"></td><td class="n" id="ir'+i+'"></td><td class="n" id="ia'+i+'"></td><td><button class="ab" data-ix="'+i+'">✕</button></td></tr>'});
 h+='<tr class="tot"><td></td><td>Total</td><td class="n" id="itq"></td><td></td><td class="n" id="ita"></td><td></td></tr></table></div><div class="btns" style="margin:12px 0 0"><button class="btn" id="ar">Add Row</button><button class="btn" id="si">Save Invoice</button></div><div class="msg" style="margin-top:8px">'+esc(invMsg)+'</div></div>';
 v.innerHTML=h;
 document.getElementById("in").oninput=function(e){I.no=e.target.value};
 document.getElementById("idt").onchange=function(e){I.date=e.target.value};
 document.getElementById("cu").oninput=function(e){I.cust=e.target.value};
 v.querySelectorAll("[data-ip]").forEach(function(el){el.onchange=function(){I.rows[+el.dataset.ip].p=el.value;invCalc()}});
 v.querySelectorAll("[data-iq]").forEach(function(el){el.oninput=function(){I.rows[+el.dataset.iq].q=el.value;invCalc()}});
 v.querySelectorAll("[data-ix]").forEach(function(el){el.onclick=function(){if(I.rows.length>1)I.rows.splice(+el.dataset.ix,1);else I.rows=[{p:"",q:""}];invoice()}});
 document.getElementById("ar").onclick=function(){I.rows.push({p:"",q:""});invMsg="";invoice()};
 document.getElementById("si").onclick=function(){
  var ok=I.rows.filter(function(r){return r.p&&+r.q>0});
  if(!ok.length){invMsg="Add at least one product with qty";invoice();return}
  var d=I.date||new Date().toISOString().slice(0,10);
  ok.forEach(function(r){sales.push({d:d,p:r.p,q:+r.q})});
  invMsg="Invoice "+I.no+" saved";
  I.no=I.no.replace(/\d+$/,function(n){var x=String(+n+1);while(x.length<n.length)x="0"+x;return x});
  I.cust="";I.rows=[{p:"",q:""}];invoice()};
 invCalc()}
var Q={},sub="products";
function invItems(){return products.filter(function(p){return +Q[p.id]>0})}
function pcalc(){var tq=0,ta=0;products.forEach(function(p,i){var q=+Q[p.id]||0,a=amt(p,q);tq+=q;ta+=a;var e=document.getElementById("ta"+i);if(e)e.textContent=q?fmt(a):""});document.getElementById("tq").textContent=f3(tq);document.getElementById("tt").textContent=fmt(ta)}
function f3(n){return Number(n).toLocaleString("en-US",{minimumFractionDigits:3,maximumFractionDigits:3})}
function invoice(){
 var it=invItems(),h=tabs();
 if(true){
  h+='<div class="lt" style="margin-top:0"><table><tr><th>Sr</th><th>Product</th><th>Rate</th><th>Qty (M)</th><th class="n">T.Amt</th></tr>';
  products.forEach(function(p,i){h+='<tr><td>'+(i+1)+'</td><td>'+esc(p.n)+'</td><td>'+fmt(p.r)+'</td><td><input type="number" step="0.001" min="0" data-q="'+esc(p.id)+'" value="'+esc(Q[p.id]||"")+'" placeholder="0" style="width:70px;padding:0;border:0;background:none;border-radius:0;font-size:14px"></td><td class="n" id="ta'+i+'"></td></tr>'});
  h+='<tr class="tot"><td></td><td>Total</td><td></td><td id="tq"></td><td class="n" id="tt"></td></tr>';
  v.innerHTML=h+'</table></div><button class="btn" id="si" style="width:100%;margin-top:12px">Save</button><div class="msg" style="margin-top:8px">'+esc(invMsg)+'</div>';
  pcalc();
  document.getElementById("si").onclick=function(){var it2=invItems();if(!it2.length){invMsg="Add qty first";invoice();return}var d=new Date().toISOString().slice(0,10);it2.forEach(function(p){sales.push({d:d,p:p.id,q:+Q[p.id]})});Q={};invMsg="Invoice saved";invoice()};
  v.querySelectorAll("[data-q]").forEach(function(el){el.oninput=function(){Q[el.dataset.q]=el.value;pcalc();}});
  return}
 h+='<div class="lt" style="margin-top:0"><table><tr><th>Sr</th><th>Product</th><th>Qty</th><th>Rate</th><th class="n">Amount</th></tr>';
 var tq=0,ta=0;
 it.forEach(function(p,i){var q=+Q[p.id],a=amt(p,q);tq+=qk(p,q);ta+=a;h+='<tr><td>'+(i+1)+'</td><td>'+esc(p.n)+'</td><td>'+f3(qk(p,q))+'</td><td>'+fmt(p.r)+'</td><td class="n">'+fmt(a)+'</td></tr>'});
 if(!it.length)h+='<tr><td colspan="5" style="text-align:center;color:var(--mut)">No products added</td></tr>';
 h+='<tr><td></td><td class="n"><b>Total</b></td><td><b>'+f3(tq)+'</b></td><td></td><td class="n"><b>'+fmt(ta)+'</b></td></tr></table></div><button class="btn" id="si" style="width:100%;margin-top:12px">Save</button><div class="msg" style="margin-top:8px">'+esc(invMsg)+'</div>';
 v.innerHTML=h;
 document.getElementById("si").onclick=function(){
  if(!it.length){invMsg="Add products first";invoice();return}
  var d=new Date().toISOString().slice(0,10);
  it.forEach(function(p){sales.push({d:d,p:p.id,q:+Q[p.id]})});
  Q={};invMsg="Invoice saved";invoice()}}
function render(){
 document.getElementById("back").style.display=page=="home"?"none":"";
 if(page=="home"){t.textContent="Sale Point";
  if(tab=="invoice"){invoice3();return}
  if(tab=="summary"){summaryView();return}
  if(tab=="sale"){saleView3();return}
  var m=["Jan-26","Feb-26","Mar-26"],h=tabs()+'<div class="panel"><div class="dates"><label>From Date <input type="date"></label><label>To Date <input type="date"></label></div><div class="scroll"><table class="g"><tr><th>Sr</th><th>Brands</th>';
  m.forEach(function(x){h+='<th>'+x+'</th>'});h+='</tr>';
  products.forEach(function(p,i){h+='<tr><td>'+(i+1)+'</td><td>'+esc(p.n)+'</td>';m.forEach(function(x,j){h+='<td><input type="number" data-j="'+j+'"></td>'});h+='</tr>'});
  h+='<tr class="tot"><td></td><td>Total FMC</td>';m.forEach(function(x,j){h+='<td class="n" id="t'+j+'">0</td>'});
  v.innerHTML=h+'</tr></table></div></div>';

 if(page=="clearAll"){clearView();return}
 if(page=="livelocation"){locView();return}
 if(page=="areacovered"){areaView();return}
 if(page=="datereport"){dateReport();return}
 if(page=="cashlist"){cashView();return}
 if(page=="ledger"){ledgerView();return}
 if(page=="setupMenu"){t.textContent="Setup";v.innerHTML='<div class="fgrid">'+folder("Product List","products")+folder("Rate List","rates")+folder("Retailers List","retailers")+folder("Payment Details List","cashlist")+'</div>';return}

 if(page=="summary"){t.textContent="Sale Summary";
  v.innerHTML='<div class="panel"><div class="dates"><label>From Date <input type="date" id="f" value="'+from+'"></label><label>To Date <input type="date" id="to" value="'+to+'"></label></div><div class="scroll" id="tb"></div></div>';

  document.getElementById("up").onclick=function(){document.getElementById("xl").click()};

  document.getElementById("q").oninput=list;list();return}

 var pts=L.map(P),svg='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Route map" style="position:absolute;left:0;top:0;width:100%;height:100%">',i;
 for(i=1;i<4;i++)svg+='<line x1="'+(W*i/4)+'" y1="0" x2="'+(W*i/4)+'" y2="'+H+'" style="stroke:var(--line);stroke-width:.5;opacity:.5"/><line x1="0" y1="'+(H*i/4)+'" x2="'+W+'" y2="'+(H*i/4)+'" style="stroke:var(--line);stroke-width:.5;opacity:.5"/>';
 if(L.length>=3){var hp=hullPoly(pts).map(function(a){return f(a)}).join(" ");svg+='<polygon points="'+hp+'" style="fill:rgba(47,111,228,.14);stroke:rgba(47,111,228,.6);stroke-width:1;stroke-dasharray:4 3"/>'}
 var path=pts.map(f).join(" ");
 svg+='<polyline points="'+path+'" style="fill:none;stroke:#fff;stroke-width:6.5;stroke-linejoin:round;stroke-linecap:round"/><polyline points="'+path+'" style="fill:none;stroke:#1fa347;stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round"/>';
 function dot(a,fill,txt,tc){return '<circle cx="'+a[0].toFixed(1)+'" cy="'+a[1].toFixed(1)+'" r="9" style="fill:'+fill+';stroke:#fff;stroke-width:2"/><text x="'+a[0].toFixed(1)+'" y="'+(a[1]+3.5).toFixed(1)+'" text-anchor="middle" style="font:bold 10px Arial;fill:'+tc+'">'+txt+'</text>'}
 svg+=dot(pts[0],"#2e9e4f","S","#fff")+dot(pts[pts.length-1],"#1f4e79","E","#fff");
 st.forEach(function(s,n){var a=P(s);svg+=dot(a,"#d9302c",String(n+1),"#fff")+'<text x="'+(a[0]+12).toFixed(1)+'" y="'+(a[1]+4).toFixed(1)+'" style="font:bold 11px Arial;fill:#000;stroke:#fff;stroke-width:3;paint-order:stroke">'+dur(s.d)+'</text>'});
 box.innerHTML='<iframe title="Map" src="https://maps.google.com/maps?ll='+clat+','+clng+'&z='+z+'&output=embed" tabindex="-1" style="position:absolute;left:0;top:0;width:100%;height:100%;border:0"></iframe>'+svg+'</svg>'}

function areaView(){
 t.textContent="Total Area Covered";

 var h='<div class="panel"><div class="dates" style="margin-bottom:8px"><label>Date <input type="date" id="adt" value="'+AD+'"></label><span class="msg" style="margin:0">Tracked 6 AM - 8 PM</span></div><div class="lt" style="margin-top:0"><table><tr><td>Total area covered</td><td class="n">'+ar.toFixed(3)+' km\u00b2</td></tr><tr><td>Distance travelled</td><td class="n">'+km.toFixed(2)+' km</td></tr><tr><td>Stops (3 min or more)</td><td class="n">'+st.length+'</td></tr></table></div>';
 if(n<2){h+='<div class="msg" style="margin:8px 0 0">'+(AD==tk?"Open Live Location to start tracking. The route, start, end and stops will show here once the sales man has moved.":"No route saved for this date.")+'</div>'}
 else{
  h+='<div id="rmap" style="position:relative;height:300px;margin-top:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--box)"></div><div class="msg" style="margin:6px 0 0">Green line = route, S = start, E = end, red dots = stops with time stayed, blue shade = area covered</div>';
  h+='<div class="lt"><table><tr><th>Point</th><th>Time</th><th class="n">Stayed</th><th></th></tr><tr><td>Start</td><td>'+tm(pts[0].t0||pts[0].t)+'</td><td class="n"></td><td><a href="'+gl(pts[0])+'" target="_blank" rel="noopener">Map</a></td></tr>';
  st.forEach(function(s,i){h+='<tr><td>Stop '+(i+1)+'</td><td>'+tm(s.t0)+'</td><td class="n">'+dur(s.d)+'</td><td><a href="'+gl(s)+'" target="_blank" rel="noopener">Map</a></td></tr>'});
  var e=pts[n-1];h+='<tr><td>End</td><td>'+tm(e.t)+'</td><td class="n"></td><td><a href="'+gl(e)+'" target="_blank" rel="noopener">Map</a></td></tr></table></div>'}
 var ds=Object.keys(LOCD).filter(function(d){return LOCD[d]&&LOCD[d].length}).sort().reverse();
 if(ds.length){h+='<div class="lt"><table><tr><th>Date</th><th class="n">Area km\u00b2</th><th class="n">Distance</th><th class="n">Stops</th></tr>';
  ds.forEach(function(d){var p=LOCD[d];h+='<tr data-ad="'+d+'" style="cursor:pointer'+(d==AD?';background:var(--tot)':'')+'"><td>'+d+'</td><td class="n">'+hullKm2(p).toFixed(3)+'</td><td class="n">'+pathKm(p).toFixed(2)+' km</td><td class="n">'+stopsList(p).length+'</td></tr>'});
  h+='</table></div>'}
 v.innerHTML=h+'</div>';
 if(n>=2)drawRoute(pts,st);
 document.getElementById("adt").onchange=function(e){AD=e.target.value||todayStr();areaView()};
 v.querySelectorAll("[data-ad]").forEach(function(r){r.onclick=function(){AD=r.dataset.ad;areaView()}})}

var rq="",rc="";
function rateView(){
 var o='<option value="">All Categories</option>';cats.forEach(function(c){o+='<option'+(c==rc?' selected':'')+'>'+c+'</option>'});
 v.innerHTML='<div style="display:flex;gap:10px"><input id="rs" placeholder="Search..." value="'+esc(rq)+'" style="flex:1"><select id="rcat" style="width:auto">'+o+'</select></div><div id="rl"></div>';

function rlist(){
 var s=rq.toLowerCase(),h='<table class="rt"><tr><th>Sr</th><th>Brands</th><th>Retail<br>Price</th><th>W.S<br>Price</th><th>Packs/<br>Outer</th><th>Sticks/<br>Pack</th><th></th></tr>',k=0,cs=cats.slice();
 products.forEach(function(p){if(p.cat&&cs.indexOf(p.cat)<0)cs.push(p.cat)});
 cs.push("");
 cs.forEach(function(c){
  if(rc&&c!=rc)return;
  var rows=products.map(function(p,i){return i}).filter(function(i){var p=products[i];return p.cat==c&&(!s||(p.id+" "+p.n).toLowerCase().indexOf(s)>=0)});
  if(!rows.length)return;
  h+='<tr><td colspan="7" class="gr">'+esc(c||"Uncategorized")+'</td></tr>';
  rows.forEach(function(i){var p=products[i];k++;
   h+='<tr><td>'+k+'</td><td>'+esc(p.n)+'</td>'+['r','ws','po','sp'].map(function(f){return '<td style="text-align:center">'+esc(p[f])+'</td>'}).join('')+'<td style="white-space:nowrap"><button class="ab" data-e="'+i+'">✎</button><button class="ab" data-rd="'+i+'">'+(delIdx==i?"✔?":"🗑")+'</button></td></tr>'})});
 document.getElementById("rl").innerHTML=h+'</table>';
 document.querySelectorAll("[data-rf]").forEach(function(el){el.oninput=function(){products[+el.dataset.ri][el.dataset.rf]=+el.value||0}})}
function list(){
 var s=(document.getElementById("q")||{value:""}).value.toLowerCase(),h='<table><tr><th>Sr</th><th>Name</th><th>Category</th><th>Action</th></tr>',k=0;
 products.forEach(function(p,i){
  if(s&&(p.id+" "+p.n+" "+p.cat).toLowerCase().indexOf(s)<0)return;
  k++;h+='<tr><td>'+k+'</td><td>'+esc(p.n)+'</td><td>'+esc(p.cat)+'</td><td style="white-space:nowrap"><button class="ab" data-e="'+i+'">✎</button><button class="ab" data-d="'+i+'">'+(delIdx==i?"✔?":"🗑")+'</button></td></tr>'});
 document.getElementById("lt").innerHTML=h+'</table>'}
function nextId(){var m=0;products.forEach(function(p){var x=parseInt(String(p.id).replace(/\D/g,""),10);if(x>m)m=x});return "P"+String(m+1).padStart(3,"0")}
function form(i){
 var p=i>=0?products[i]:{id:"",n:"",cat:"",r:"",ws:"",po:10,sp:20,pic:""};
 var o='<option value="">Category</option>';cats.forEach(function(c){o+='<option'+(c==p.cat?' selected':'')+'>'+c+'</option>'});
 modal.innerHTML='<div class="mc"><div class="mh"><h3>'+(i>=0?"Edit Product":"Add New Product")+'</h3><button class="ic" id="mx" aria-label="Close">×</button></div>'+
 '<div class="fld"><label>Product Name</label><input id="f_n" value="'+esc(p.n)+'"></div>'+
 '<div class="fld"><label>Category</label><select id="f_c">'+o+'</select></div>'+
 '<div class="row2"><div><label>Retail Price</label><input type="number" id="f_r" value="'+esc(p.r)+'"></div><div><label>W.S. Price</label><input type="number" id="f_w" value="'+esc(p.ws)+'"></div></div>'+
 '<div class="row2"><div><label>Packs/Outer</label><input type="number" id="f_po" value="'+esc(p.po)+'"></div><div><label>Sticks/Pack</label><input type="number" id="f_sp" value="'+esc(p.sp)+'"></div></div>'+
 '<button class="btn" id="sv" style="width:100%">Save</button></div>';
 modal.classList.add("show");
 var pic=p.pic;
 document.getElementById("mx").onclick=function(){modal.classList.remove("show")};
 document.getElementById("f_c").onchange=function(e){var c=e.target.value;if(c=="VELO")document.getElementById("f_po").value=5;else if(c=="FMC")document.getElementById("f_po").value=10};
 document.getElementById("sv").onclick=function(){
  var n=document.getElementById("f_n").value.trim(),id=i>=0?products[i].id:nextId();
  if(!n){document.getElementById("f_n").focus();return}
  var np={id:id,n:n,cat:document.getElementById("f_c").value,r:+document.getElementById("f_r").value||0,ws:+document.getElementById("f_w").value||0,po:+document.getElementById("f_po").value||0,sp:+document.getElementById("f_sp").value||0,pic:pic};
  if(i>=0)products[i]=np;else products.push(np);
  if(np.cat&&cats.indexOf(np.cat)<0)cats.push(np.cat);
  modal.classList.remove("show");render()}
}
function sumTable(){
 var q={},h='<table><tr><th>Sr</th><th>Product</th><th class="n">Qty</th><th class="n">Amt</th></tr>',tq=0,ta=0;
 sales.forEach(function(s){if((!from||s.d>=from)&&(!to||s.d<=to))q[s.p]=(q[s.p]||0)+s.q});
 var k=0;products.forEach(function(p){var n=q[p.id]||0;if(!(n>0))return;var i=k++,a=amt(p,n);tq+=qk(p,n);ta+=a;
  h+='<tr><td>'+(i+1)+'</td><td>'+esc(p.n)+'</td><td class="n">'+f3(qk(p,n))+'</td><td class="n">'+f2(a)+'</td></tr>'});
 h+='<tr class="tot"><td></td><td>Total</td><td class="n">'+f3(tq)+'</td><td class="n">'+f2(ta)+'</td></tr></table>';
 document.getElementById("tb").innerHTML=h}
function nk(k){return String(k).toLowerCase().replace(/[^a-z0-9]/g,"")}
function pick(r,al){var ks=Object.keys(r);for(var a=0;a<al.length;a++)for(var i=0;i<ks.length;i++)if(nk(ks[i])==al[a]&&r[ks[i]]!=null&&String(r[ks[i]]).trim()!=="")return r[ks[i]];return ""}
function pickF(r,al,fn){var v=pick(r,al);if(v!=="")return v;var ks=Object.keys(r);for(var i=0;i<ks.length;i++)if(fn(nk(ks[i]))&&String(r[ks[i]]).trim()!=="")return r[ks[i]];return ""}
function num(v){var n=parseFloat(String(v).replace(/,/g,""));return isNaN(n)?0:n}
document.getElementById("xl").onchange=function(e){
 var f=e.target.files[0];if(!f)return;var rd=new FileReader();
 rd.onload=function(){try{
  if(typeof XLSX==="undefined")throw new Error("noxlsx");
  var wb=XLSX.read(rd.result,{type:"array"}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""}),add=0,upd=0;
  rows.forEach(function(r){
   var n=String(pick(r,["name","productname","product","brand","brands","brandname","item","itemname","description"])).trim();if(!n)return;
   var id=String(pick(r,["productid","id","code","sku"])).trim(),cat=String(pick(r,["category","cat","type","group"])).trim();
   var k=products.findIndex(function(x){return id?String(x.id)==id:x.n.toLowerCase()==n.toLowerCase()});
   var old=k>=0?products[k]:null;
   var np={id:id||(old?old.id:nextId()),n:(old&&!id)?old.n:n,cat:cat||(old?old.cat:""),
    r:num(pickF(r,["retailprice","retail","price","rate","retailrate","rprice"],function(k){return k.indexOf("retail")>=0}))||(old?old.r:0),
    ws:num(pickF(r,["wsprice","wholesaleprice","wholesale","ws","wsrate"],function(k){return k.indexOf("ws")>=0||k.indexOf("whole")>=0}))||(old?old.ws:0),
    po:num(pickF(r,["packsouter","packsperouter","packs","outer"],function(k){return k.indexOf("outer")>=0||(k.indexOf("pack")==0&&k.indexOf("stick")<0)}))||(old?old.po:10),
    sp:num(pickF(r,["stickspack","sticksperpack","sticks"],function(k){return k.indexOf("stick")>=0}))||(old?old.sp:20),pic:old?old.pic:""};
   if(k>=0){products[k]=np;upd++}else{products.push(np);add++}
   if(np.cat&&cats.indexOf(np.cat)<0)cats.push(np.cat)});
  var hdr=rows.length?Object.keys(rows[0]):[],sk=hdr.filter(function(k){return nk(k).indexOf("stick")>=0})[0];
  upMsg=(add||upd)?(add+" added, "+upd+" updated | Sticks column: "+(sk?sk:"not found, default 20 used")):"No products found - the sheet needs a Name (or Product Name / Brand) column in the first row";
 }catch(x){upMsg=(x&&x.message=="noxlsx")?"Excel reader could not load - check the internet and reload":"Could not read this file"}
 e.target.value="";render()};
 rd.readAsArrayBuffer(f)};
